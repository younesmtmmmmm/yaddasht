name: Build Android APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Extract project
        run: |
          mkdir project
          unzip -q *.zip -d project

      - name: Find project folder
        run: |
          PROJECT_DIR=$(find project \( -name settings.gradle.kts -o -name settings.gradle \) | head -1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Force JVM 17
        run: |
          cat > "$PROJECT_DIR/force-jvm.gradle" <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  options.release.set(17)
              }
              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions.jvmTarget = "17"
              }
          }
          EOF

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle -I force-jvm.gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yaddasht-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
