name: Build Android APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Extract project
        run: |
          mkdir project
          unzip -q *.zip -d project
          echo "Project files:"
          find project -maxdepth 3 -type f | head -100

      - name: Find project folder
        run: |
          PROJECT_DIR=$(find project -name settings.gradle.kts -o -name settings.gradle | head -1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Fix JVM targets
        run: |
          APP_GRADLE=$(find "$PROJECT_DIR/app" -maxdepth 1 -name "build.gradle.kts" -o -name "build.gradle" | head -1)
          echo "Using: $APP_GRADLE"
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$APP_GRADLE"
          sed -i 's/jvmTarget *= *"1.8"/jvmTarget = "17"/g' "$APP_GRADLE"
          sed -i "s/jvmTarget *= *'1.8'/jvmTarget = '17'/g" "$APP_GRADLE"
          echo "JVM target fixed."

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yaddasht-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
