name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name '*اصلاح‌شده.zip' | head -n 1)
          echo "Using: $ZIP"
          unzip -q "$ZIP" -d project

      - name: Find project folder
        run: |
          PROJECT=$(find project -name settings.gradle.kts -printf '%h\n' | head -n 1)
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: ${{ env.PROJECT }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yaddasht-APK
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
